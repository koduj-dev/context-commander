name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please **do not** report
        security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
      placeholder: When I … I expected … but instead …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or tag
      description: Pre-1.0, there are no releases yet — the commit SHA you're on.
      placeholder: f09bf7c
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Local docker-compose (deploy/docker-compose.yml)
        - Built from source (ccd binary)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Which backend does the bug involve?
      options:
        - Identity / RBAC / RLS
        - Crypto / key rotation
        - Artifacts (write/read/versioning)
        - Storage (filesystem / S3 / MinIO)
        - CLI (ccd bootstrap/user/token/migrate)
        - Not backend-specific
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output, and the exact command/flags you ran.
      render: shell

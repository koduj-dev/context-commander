name: 💡 Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Check
        [docs/architecture-cookbook.md §23-24](../blob/main/docs/architecture-cookbook.md) first —
        it lists what's in scope for the first push and what's deliberately deferred.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Identity / Projects / RBAC
        - Crypto / key management
        - Artifacts
        - Handoffs
        - Skills registry
        - Events
        - History / session lineage
        - MCP / HTTP / CLI adapters
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.

name: context-commander

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER stays the default initdb superuser ("postgres") — it
      # only bootstraps the cluster. cc_owner/cc_app are created explicitly
      # below with the exact non-superuser attributes production needs, so
      # dev matches prod instead of silently running as superuser.
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: context_commander
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cc_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_commander"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # An S3 server for poking at internal/storage/s3 by hand. Opt-in:
    #
    #   docker compose -f deploy/docker-compose.yml --profile s3 up -d
    #
    # It used to be MinIO and it used to start with `make dev-up`. Two reasons
    # it is neither any more:
    #
    #   - MinIO withdrew its community images from the public registries in
    #     2025. `minio/minio` answers "pull access denied ... repository does
    #     not exist" on Docker Hub and on quay.io, for `latest` and for pinned
    #     releases alike, so `make dev-up` had quietly stopped working for
    #     anyone cloning fresh. The symptom only appears on a machine without
    #     the image already cached, which is why it surfaced in CI.
    #   - Nothing needs it. `ccd serve` constructs no S3 store (the backend is
    #     experimental and not selectable — README, cookbook §8.1), the
    #     filesystem store is the default, and the package's own tests start
    #     their own container. A service in the default `up` that nothing uses
    #     is a download every contributor pays for and nobody spends.
    #
    # adobe/s3mock implements the S3 API and nothing else. It has no console,
    # which is the one thing lost here, and it authenticates nothing — so any
    # credentials are accepted.
    profiles: ["s3"]
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      initialBuckets: cc-dev
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9090 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldap:
    # A directory to develop LDAP sign-in against (docs/adr/0019). Opt-in, like
    # `app` and `s3`: `make dev-up` must keep starting only Postgres, because
    # everyday Go work and `make test` need neither this nor a pull of it.
    #
    #   docker compose -f deploy/docker-compose.yml --profile ldap up -d
    #
    # osixia/openldap is archived upstream. It is still the image with the
    # least ceremony for a seeded, disposable directory — bitnami/openldap no
    # longer publishes free tags at all — and this is a fixture, not a
    # dependency of anything shipped. The Go integration test brings up its
    # own container (internal/directory), so nothing in CI depends on this
    # service existing.
    profiles: ["ldap"]
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    # --copy-service is what makes the bootstrap LDIFs below run: without it
    # the image ignores the mounted assets entirely and starts an empty tree,
    # which looks like "my seed data is wrong" rather than "my seed data was
    # never read".
    command: ["--copy-service", "--loglevel", "info"]
    environment:
      LDAP_ORGANISATION: Context Commander Dev
      LDAP_DOMAIN: example.test
      LDAP_ADMIN_PASSWORD: ldap_admin_dev_only
      # Keep it plain LDAP on loopback. TLS here would be a self-signed
      # certificate that every client then has to be told to ignore, which
      # teaches the wrong habit in the one place the habit matters.
      LDAP_TLS: "false"
    ports:
      - "127.0.0.1:1389:389"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - cc_ldap_data:/var/lib/ldap
      - cc_ldap_config:/etc/ldap/slapd.d
    healthcheck:
      # Binds as the service account the server will use, against the subtree
      # it will search. A healthcheck that only proves the port is open would
      # pass on an empty directory, which is the failure worth catching.
      test:
        - "CMD-SHELL"
        - >-
          ldapsearch -x -H ldap://localhost:389
          -D cn=readonly,ou=services,dc=example,dc=test -w ldap-dev-password
          -b ou=people,dc=example,dc=test "(uid=alice)" uid | grep -q "^uid: alice"
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # An OIDC provider to develop browser sign-in against (docs/adr/0019).
    # Opt-in like the others, and more deliberately so than most: the image is
    # several hundred megabytes and takes tens of seconds to answer.
    #
    #   docker compose -f deploy/docker-compose.yml --profile oidc up -d
    #
    # A real provider rather than a mock on purpose. Verifying the ID token's
    # signature IS the security core of OIDC, and a mock would mean checking
    # our verifier against our own idea of what a token looks like.
    #
    # deploy/oidc/README.md records what had to be measured rather than
    # assumed — the mandatory file name, the user who cannot sign in without
    # an email, and the fact that Keycloak lowercases addresses.
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    # start-dev keeps everything in an in-memory H2 database: the realm is
    # re-imported on every fresh container and there is no second datastore to
    # back up or migrate. Never this command outside development.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak_dev_only
      KC_HEALTH_ENABLED: "true"
    ports:
      # 18081, not 8080: that port is too popular to assume it is free.
      - "127.0.0.1:18081:8080"
    volumes:
      # The file name must match the realm it contains or Keycloak refuses to
      # start — see the README.
      - ./oidc/context-commander-realm.json:/opt/keycloak/data/import/context-commander-realm.json:ro
    healthcheck:
      # Fetches the realm's own discovery document and looks for a claim only
      # a started, imported realm can produce. A port check would pass while
      # Keycloak was still serving its master realm and nothing else, which is
      # the failure worth catching. The image carries no curl or wget, so this
      # is a raw request over bash's /dev/tcp.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/context-commander/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 &&
          grep -q token_endpoint <&3
      interval: 5s
      timeout: 5s
      retries: 40

  app:
    # Opt-in: `make dev-up` / a plain `docker compose ... up` (used by
    # everyday Go dev and `make test`) must keep starting only Postgres.
    # Bring this service up explicitly with
    # `docker compose -f deploy/docker-compose.yml --profile app up -d --build`.
    profiles: ["app"]
    build:
      # Repo root (this file's parent), where the Dockerfile and go.mod
      # live — deploy/ only holds compose/deployment config, not the build
      # itself.
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # cc_app is the only role the running server connects as (RLS-enforced,
      # see docs/adr/0002) — migrations and the first user/PAT are NOT run
      # automatically here, same as the bare-binary flow in the README: run
      # them once via
      #   docker compose -f deploy/docker-compose.yml run --rm \
      #     -e CC_DATABASE_URL=postgres://cc_owner:cc_owner_dev_password@postgres:5432/context_commander?sslmode=disable \
      #     app migrate
      #   docker compose -f deploy/docker-compose.yml run --rm app \
      #     bootstrap --email you@example.com --name "Your Name"
      CC_DATABASE_URL: postgres://cc_app:cc_app_dev_password@postgres:5432/context_commander?sslmode=disable
      # Dev-only convenience key — never reuse outside a disposable local
      # environment (docs/adr/0005). Required, no default: a real deployment
      # must not silently start with a fixed/known key.
      CC_ROOT_KEY: ${CC_ROOT_KEY:?set CC_ROOT_KEY in the environment or a .env file next to this compose file, e.g. $(openssl rand -base64 32)}
    ports:
      - "127.0.0.1:8490:8490"
    volumes:
      - cc_app_storage:/data

volumes:
  # Named volumes, managed by Docker outside the repo tree — a container-owned
  # bind-mount under the repo (e.g. ./data/postgres) breaks `go build ./...`
  # (permission denied walking container-owned files) and is generally the
  # wrong place for engine-owned data files anyway.
  cc_postgres_data:
  cc_app_storage:
  cc_ldap_data:
  cc_ldap_config:

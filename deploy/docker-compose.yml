name: context-commander

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER stays the default initdb superuser ("postgres") — it
      # only bootstraps the cluster. cc_owner/cc_app are created explicitly
      # below with the exact non-superuser attributes production needs, so
      # dev matches prod instead of silently running as superuser.
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: context_commander
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cc_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_commander"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cc_dev
      MINIO_ROOT_PASSWORD: cc_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cc_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Opt-in: `make dev-up` / a plain `docker compose ... up` (used by
    # everyday Go dev and `make test`) must keep only starting Postgres +
    # MinIO, unchanged. Bring this service up explicitly with
    # `docker compose -f deploy/docker-compose.yml --profile app up -d --build`.
    profiles: ["app"]
    build:
      # Repo root (this file's parent), where the Dockerfile and go.mod
      # live — deploy/ only holds compose/deployment config, not the build
      # itself.
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # cc_app is the only role the running server connects as (RLS-enforced,
      # see docs/adr/0002) — migrations and the first user/PAT are NOT run
      # automatically here, same as the bare-binary flow in the README: run
      # them once via
      #   docker compose -f deploy/docker-compose.yml run --rm \
      #     -e CC_DATABASE_URL=postgres://cc_owner:cc_owner_dev_password@postgres:5432/context_commander?sslmode=disable \
      #     app migrate
      #   docker compose -f deploy/docker-compose.yml run --rm app \
      #     bootstrap --email you@example.com --name "Your Name"
      CC_DATABASE_URL: postgres://cc_app:cc_app_dev_password@postgres:5432/context_commander?sslmode=disable
      # Dev-only convenience key — never reuse outside a disposable local
      # environment (docs/adr/0005). Required, no default: a real deployment
      # must not silently start with a fixed/known key.
      CC_ROOT_KEY: ${CC_ROOT_KEY:?set CC_ROOT_KEY in the environment or a .env file next to this compose file, e.g. $(openssl rand -base64 32)}
    ports:
      - "127.0.0.1:8490:8490"
    volumes:
      - cc_app_storage:/data

volumes:
  # Named volumes, managed by Docker outside the repo tree — a container-owned
  # bind-mount under the repo (e.g. ./data/postgres) breaks `go build ./...`
  # (permission denied walking container-owned files) and is generally the
  # wrong place for engine-owned data files anyway.
  cc_postgres_data:
  cc_minio_data:
  cc_app_storage:

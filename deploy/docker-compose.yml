name: context-commander

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER stays the default initdb superuser ("postgres") — it
      # only bootstraps the cluster. cc_owner/cc_app are created explicitly
      # below with the exact non-superuser attributes production needs, so
      # dev matches prod instead of silently running as superuser.
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: context_commander
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cc_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d context_commander"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cc_dev
      MINIO_ROOT_PASSWORD: cc_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - cc_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Named volumes, managed by Docker outside the repo tree — a container-owned
  # bind-mount under the repo (e.g. ./data/postgres) breaks `go build ./...`
  # (permission denied walking container-owned files) and is generally the
  # wrong place for engine-owned data files anyway.
  cc_postgres_data:
  cc_minio_data:
